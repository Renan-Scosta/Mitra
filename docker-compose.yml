version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mitra-db
    environment:
      POSTGRES_DB: mitra
      POSTGRES_USER: ${DB_USERNAME:-mitra}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mitra}
    ports:
      - "5432:5432"
    volumes:
      - mitra-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mitra -d mitra"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./mitra/mitra
      dockerfile: Dockerfile
    container_name: mitra-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/mitra
      DB_USERNAME: mitra
      DB_PASSWORD: ${DB_PASSWORD:-mitra}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-minimum-32-chars}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-not-set}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-not-set}
    ports:
      - "8080:8080"

volumes:
  mitra-pgdata:
