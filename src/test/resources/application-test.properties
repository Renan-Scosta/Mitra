# ============================================================
# Test profile — PostgreSQL via TestContainers
# ============================================================
# DataSource is auto-configured by @ServiceConnection — no manual URL needed

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway — runs the same production migrations on real PostgreSQL
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Disable OAuth2 auto-configuration for tests
spring.autoconfigure.exclude=org.springframework.boot.security.oauth2.client.autoconfigure.OAuth2ClientAutoConfiguration,org.springframework.boot.security.oauth2.client.autoconfigure.servlet.OAuth2ClientWebSecurityAutoConfiguration

spring.security.oauth2.client.registration.google.client-id=dummy-test-id

# Dummy JWT Secret for tests
api.security.token.secret=dummy-test-secret-minimum-32-characters-long
