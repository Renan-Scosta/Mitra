# ============================================================
# Staging Environment Properties
# Inherits from application.properties
# ============================================================

# Disable show-sql to keep logs clean in staging
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Keep logging clean, only INFO and ERROR
logging.level.com.mitra=INFO
logging.level.com.mitra.infrastructure.security=WARN

# Allow viewing full health details for verification in staging
management.endpoint.health.show-details=always
